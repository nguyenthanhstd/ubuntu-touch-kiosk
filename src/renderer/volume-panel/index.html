<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <title>Âm lượng</title>
    <link rel="stylesheet" href="volume-panel.css" />
    <link rel="stylesheet" href="volume-controls.css" />
  </head>
  <body>
    <!--
      Thẻ Âm lượng. Cửa sổ riêng (xem `main/panel-window.ts`) chứ không phải một popup trong thanh trên:
      dải trên là một `WebContentsView` cao đúng 44 px nên mọi thứ vẽ ra dưới nó bị chính *view* cắt.
      Yêu cầu là bảng nằm giữa màn hình phía trên, dưới đồng hồ, và to ra — cả hai đều bất khả thi
      trong lòng 44 px đó.

      Thứ tự trong thẻ: glyph loa cỡ lớn (cho biết đang tắt tiếng hay không từ khoảng cách vài mét),
      rồi con số phần trăm, rồi hàng − / thanh kéo / +, rồi hàng phụ. Con số đứng **trên** thanh kéo vì
      khi ngón đang che thanh kéo thì con số là thứ duy nhất còn đọc được.
    -->
    <section class="card" id="card" role="dialog" aria-label="Âm lượng">
      <header class="card__head">
        <div class="card__title">
          <span class="card__glyph" id="head-glyph" aria-hidden="true"></span>
          <h1>Âm lượng</h1>
        </div>
        <button class="card__close" id="close" type="button" aria-label="Đóng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </header>

      <div class="card__body">
        <div class="readout">
          <span class="readout__value" id="level-value" aria-live="polite">—</span>
          <span class="readout__unit">%</span>
        </div>
        <p class="readout__sink" id="sink-name"></p>

        <div class="slider-row">
          <button class="step step--down" id="step-down" type="button" aria-label="Giảm âm lượng" title="Giảm 5%">
            <span class="step__glyph" id="glyph-minus" aria-hidden="true"></span>
          </button>

          <!--
            Thanh kéo gốc của trình duyệt, không phải một bộ kéo tự viết: nó đã xử lý chạm, kéo, bàn
            phím và `aria-valuenow`, và trên panel này chỉ có một ngón tay tác động. Phần tô màu đi qua
            biến `--volume-fill` mà `volume-panel.ts` ghi mỗi khung — `::-webkit-slider-runnable-track`
            không chọn được từ script.
          -->
          <input
            class="range"
            id="range"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
            aria-label="Mức âm lượng"
          />

          <button class="step step--up" id="step-up" type="button" aria-label="Tăng âm lượng" title="Tăng 5%">
            <span class="step__glyph" id="glyph-plus" aria-hidden="true"></span>
          </button>
        </div>

        <div class="marks" aria-hidden="true">
          <span>0</span>
          <span>50</span>
          <span>100</span>
        </div>
      </div>

      <footer class="card__foot">
        <button class="mute" id="mute" type="button" aria-pressed="false">
          <span class="mute__glyph" id="glyph-mute" aria-hidden="true"></span>
          <span class="mute__label" id="mute-label">Tắt tiếng</span>
        </button>
        <span class="card__status" id="status" role="status" aria-live="polite"></span>
      </footer>
    </section>

    <script type="module" src="volume-panel.js"></script>
  </body>
</html>
