<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <title>NT Fitness — màn hình chờ</title>
    <link rel="stylesheet" href="../shared/clock-digits.css" />
    <link rel="stylesheet" href="lock.css" />
  </head>
  <body>
    <!--
      Màn hình chờ. Cả trang là một vùng chạm: không có nút nào ngoài đúng một gợi ý ở dưới.
      Nền đen đặc ở đây là *có chủ đích* — panel không có đèn nền (đã đo: /sys/class/backlight rỗng),
      nên hạ độ sáng duy nhất còn lại là vẽ ít điểm ảnh sáng nhất có thể.
    -->
    <main class="lock" id="lock">
      <div class="lock__glow" aria-hidden="true"></div>

      <div class="lock__clock">
        <div class="lock__time" id="time" role="timer" aria-label="Giờ Hồ Chí Minh"></div>
        <div class="lock__date" id="date"></div>
      </div>

      <div class="lock__foot">
        <div class="lock__hint" id="hint">
          <svg
            class="lock__hint-icon"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span id="hint-text">Chạm để mở khóa</span>
        </div>
      </div>

      <!-- Vệt sáng chạy ngang khi mở khóa: phản hồi duy nhất cho một cú chạm thành công. -->
      <div class="lock__sweep" id="sweep" aria-hidden="true"></div>
    </main>
    <script type="module" src="lock.js"></script>
  </body>
</html>
